  <text x="648" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7D8796" text-anchor="middle">12k</text>
  <text x="782" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7D8796" text-anchor="middle">16k+ tokens</text>

