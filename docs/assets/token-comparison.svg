  <text x="32" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9AA4B2">127 tools hidratadas · ~60 KB</text>
  <rect x="246" y="98" width="504" height="28" rx="6" fill="url(#barFull)"/>
  <text x="740" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">~15 000 tokens (est. catálogo vivo)</text>

