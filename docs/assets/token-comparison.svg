  <text x="32" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7D8796">Sutra v1.0.0 (by SCIO DC) · Configura el modo con SCIO_SCHEMA_MODE=codemode|facade|full o settings.json ("schema_mode")</text>
