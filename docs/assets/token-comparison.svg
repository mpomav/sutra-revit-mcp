<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 366" width="860" height="366" role="img" aria-label="Sutra Revit MCP — Initial Context Footprint Comparison">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161A"/>
      <stop offset="100%" stop-color="#1D2128"/>
    </linearGradient>
    <linearGradient id="barFull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D9483B"/>
      <stop offset="100%" stop-color="#F06A5E"/>
    </linearGradient>
    <linearGradient id="barScio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E06400"/>
      <stop offset="100%" stop-color="#FF8A2B"/>
    </linearGradient>
    <linearGradient id="barFacade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F9D68"/>
      <stop offset="100%" stop-color="#34C785"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="860" height="366" rx="14" fill="url(#bg)" stroke="#2D333E" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F6F8">Sutra v1.0.0 — Carga inicial de contexto MCP</text>
  <text x="32" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9AA4B2">Medición de initialize + tools/list (arquitectura Clean-Room: 130 herramientas; ~4 B/token)</text>

  <!-- Grid lines -->
  <line x1="236" y1="86" x2="236" y2="290" stroke="#2D333E" stroke-width="1"/>
  <line x1="370" y1="86" x2="370" y2="290" stroke="#242933" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="504" y1="86" x2="504" y2="290" stroke="#242933" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="638" y1="86" x2="638" y2="290" stroke="#242933" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="772" y1="86" x2="772" y2="290" stroke="#242933" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- X-axis labels -->
  <text x="236" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7D8796" text-anchor="middle">0</text>
  <text x="370" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7D8796" text-anchor="middle">25k</text>
  <text x="504" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7D8796" text-anchor="middle">50k</text>
  <text x="638" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7D8796" text-anchor="middle">75k</text>
  <text x="772" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7D8796" text-anchor="middle">100k+ tokens</text>

  <!-- Row 1: Full (MCP normal) -->
  <text x="32" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F4F6F8">MCP normal (full)</text>
  <text x="32" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9AA4B2">130+ tools · 409 KB · Satura contexto</text>
  <rect x="236" y="98" width="548" height="28" rx="6" fill="url(#barFull)"/>
  <text x="774" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">~102 300 tokens (base)</text>

  <!-- Row 2: Full + Pack Core -->
  <text x="32" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F4F6F8">full + pack core</text>
  <text x="32" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9AA4B2">4 tools · 10.3 KB · Filtrado por pack</text>
  <rect x="236" y="150" width="16" height="28" rx="5" fill="#6C7A89"/>
  <text x="262" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#D5DCE4">~2 575 tokens  (-97.5%)</text>

  <!-- Row 3: Sutra Code Mode (default) -->
  <text x="32" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FF9A44">Sutra Code Mode ★</text>
  <text x="32" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#C7D0DC">4 tools · 7.8 KB · Default v1.0.0</text>
  <rect x="236" y="202" width="12" height="28" rx="5" fill="url(#barScio)"/>
  <text x="258" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FF9A44">~1 940 tokens  (-98.1%)  · Descubre firmas y orquesta las 130 tools</text>

  <!-- Row 4: Sutra Facade -->
  <text x="32" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#34C785">Sutra Facade</text>
  <text x="32" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#C7D0DC">4 tools · 6.8 KB · Paso a paso sin scripts</text>
  <rect x="236" y="254" width="10" height="28" rx="5" fill="url(#barFacade)"/>
  <text x="256" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#34C785">~1 710 tokens  (-98.3%)  · Descubrimiento bajo demanda</text>

  <!-- Footer -->
  <text x="32" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7D8796">Sutra v1.0.0 (by SCIO DC) · Cambia de modo en 1 clic desde Revit (Sutra → Ajustes → Opciones avanzadas) o con SCIO_SCHEMA_MODE</text>
</svg>
