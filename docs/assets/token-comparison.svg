  <line x1="380" y1="86" x2="380" y2="290" stroke="#242933" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="514" y1="86" x2="514" y2="290" stroke="#242933" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="648" y1="86" x2="648" y2="290" stroke="#242933" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="782" y1="86" x2="782" y2="290" stroke="#242933" stroke-width="1" stroke-dasharray="3,4"/>

