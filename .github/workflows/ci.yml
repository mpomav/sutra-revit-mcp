name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build core & server
        run: |
          dotnet build src/Scio.Abstractions/Scio.Abstractions.csproj -c Release
          dotnet build src/Scio.Ipc/Scio.Ipc.csproj -c Release
          dotnet build src/Scio.Server/Scio.Server.csproj -c Release

      - name: Run unit tests
        run: dotnet test tests/Scio.Core.Tests/Scio.Core.Tests.csproj -c Release --nologo

      - name: Clean-room audit
        shell: pwsh
        run: pwsh -File build/audit-clean-room.ps1

      - name: Dependency vulnerability check
        run: |
          dotnet list src/Scio.Abstractions/Scio.Abstractions.csproj package --vulnerable --include-transitive
          dotnet list src/Scio.Server/Scio.Server.csproj package --vulnerable --include-transitive

  build-cad-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cad_year: [2023, 2024, 2025, 2026]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build Scio.Cad ${{ matrix.cad_year }}
        run: dotnet build src/Scio.Cad/Scio.Cad.csproj -c Release -p:CadYear=${{ matrix.cad_year }} -p:UseLocalCadApi=false --nologo

  build-revit-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit_year: [2023, 2024, 2025, 2026, 2027]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build Revit ${{ matrix.revit_year }} payload
        shell: pwsh
        run: pwsh -File build/build-all.ps1 -Years ${{ matrix.revit_year }} -SkipTests
